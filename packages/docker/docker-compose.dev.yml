  mock-oauth2-server:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    ports:
      - "8080:8080"
    volumes:
      - ./oauth/login.html:/app/config/login.html:ro
    environment:
      JSON_CONFIG: |
        {
          "interactiveLogin": true,
          "loginPagePath": "/app/config/login.html",
          "tokenCallbacks": [
            {
              "issuerId": "default",
              "tokenExpiry": 3600,
              "requestMappings": [
                {
                  "requestParam": "code",
                  "match": "debug",
                  "claims": {
                    "sub": "user123",
                    "aud": ["my-audience"],
                    "email": "dev@example.com",
                    "nickname": "dev"
                  }
                },
                {
                  "requestParam": "client_id",
                  "match": "m2m-client",
                  "claims": {
                    "sub": "m2m-client",
                    "aud": ["my-audience"],
                    "scope": "read write"
                  }
                }
              ]
            }
          ]
        }

  mock-gcp-kms:
    image: ghcr.io/blackwell-systems/gcp-kms-emulator-dual:0.9
    container_name: mock-gcp-kms
    ports:
      - "9090:9090"   # gRPC — what the Node SDK speaks
    volumes:
      - ./script/seed-gcp-kms-mock.sh:/script/seed-gcp-kms-mock.sh:ro
    environment:
      GCP_KMS_LOG_LEVEL: info
      # Read by the seeder below, from inside the container.
      KMS_EMULATOR_REST: http://localhost:8080
