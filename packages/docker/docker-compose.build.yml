services:
  api:
    image: ${API_REPO:-console-api}:${API_TAG:-latest}
    build:
      context: ../..
      dockerfile: packages/docker/Dockerfile.node
      target: production
      args:
        WORKSPACE: apps/api
        GITHUB_PAT: ${GITHUB_PAT}

  tx-signer:
    image: ${TX_SIGNER_REPO:-console-tx-signer}:${TX_SIGNER_TAG:-latest}
    build:
      context: ../..
      dockerfile: packages/docker/Dockerfile.node
      target: production
      args:
        WORKSPACE: apps/tx-signer

  notifications:
    image: ${NOTIFICATIONS_REPO:-notifications}:${NOTIFICATIONS_TAG:-latest}
    build:
      context: ../..
      dockerfile: packages/docker/Dockerfile.node
      target: production
      args:
        WORKSPACE: apps/notifications

  indexer:
    image: ${INDEXER_REPO:-console-indexer}:${INDEXER_TAG:-latest}
    build:
      context: ../..
      dockerfile: packages/docker/Dockerfile.node
      target: production
      args:
        WORKSPACE: apps/indexer

  provider-inventory:
    image: ${PROVIDER_INVENTORY_REPO:-console-provider-inventory}:${PROVIDER_INVENTORY_TAG:-latest}
    build:
      context: ../..
      dockerfile: packages/docker/Dockerfile.node
      target: production
      args:
        WORKSPACE: apps/provider-inventory

  provider-proxy:
    image: ${PROVIDER_PROXY_REPO:-console-provider-proxy}:${PROVIDER_PROXY_TAG:-latest}
    build:
      context: ../..
      dockerfile: packages/docker/Dockerfile.node
      target: production
      args:
        WORKSPACE: apps/provider-proxy

  deploy-web:
    image: ${DEPLOY_WEB_REPO:-console-deploy-web}:${DEPLOY_WEB_TAG:-latest}
    build:
      context: ../..
      dockerfile: packages/docker/Dockerfile.nextjs
      target: production
      args:
        WORKSPACE: apps/deploy-web
        DEPLOYMENT_ENV: ${DEPLOYMENT_ENV}
        GIT_COMMIT_HASH: ${GIT_COMMIT_HASH}
      secrets:
        - sentry_auth_token

  stats-web:
    image: ${STATS_WEB_REPO:-console-stats-web}:${STATS_WEB_TAG:-latest}
    build:
      context: ../..
      dockerfile: packages/docker/Dockerfile.nextjs
      target: production
      args:
        WORKSPACE: apps/stats-web
        DEPLOYMENT_ENV: ${DEPLOYMENT_ENV}
        GIT_COMMIT_HASH: ${GIT_COMMIT_HASH}
        # without --enable-source-maps: source-mapping each server error stack blocks the event loop long enough to fail the liveness probe
        NODE_OPTIONS: --no-network-family-autoselection
      secrets:
        - sentry_auth_token

  provider-console:
    image: ${PROVIDER_CONSOLE_REPO:-console-provider}:${PROVIDER_CONSOLE_TAG:-latest}
    build:
      context: ../..
      dockerfile: packages/docker/Dockerfile.nextjs
      target: production
      args:
        WORKSPACE: apps/provider-console
        DEPLOYMENT_ENV: ${DEPLOYMENT_ENV}

secrets:
  sentry_auth_token:
    environment: SENTRY_AUTH_TOKEN
