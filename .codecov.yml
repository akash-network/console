codecov:
  # By default Codecov posts no status at all on a commit where any other check failed, so every result job
  # polling codecov/patch would wait out its budget and fail, even for apps whose own jobs all passed.
  require_ci_to_pass: false

coverage:
  status:
    project:
      default: false
      api:
        target: 75%
        flags:
          - api
      deploy-web:
        target: 40%
        flags:
          - deploy-web
      notifications:
        target: 80%
        flags:
          - notifications
      provider-proxy:
        target: 80%
        flags:
          - provider-proxy
    patch:
      default: off
      api:
        target: 80%
        flags:
          - api
      deploy-web:
        target: 50%
        flags:
          - deploy-web
      notifications:
        target: 80%
        flags:
          - notifications
      provider-proxy:
        target: 80%
        flags:
          - provider-proxy

ignore:
  - "**/*.spec.ts"
  - "**/*.spec.tsx"
  - "**/next-env.d.ts"
  - "**/pages/_app.tsx"
  - "**/pages/_document.tsx"
  - "**/pages/_error.tsx"
  - "**/Editor/monaco-*.ts"
  - "**/Editor/*.worker.ts"

flags:
  api:
    carryforward: true
    paths:
      - apps/api/
  deploy-web:
    carryforward: true
    paths:
      - apps/deploy-web/
  indexer:
    carryforward: true
    paths:
      - apps/indexer/
  notifications:
    carryforward: true
    paths:
      - apps/notifications/
  provider-console:
    carryforward: true
    paths:
      - apps/provider-console/
  provider-proxy:
    carryforward: true
    paths:
      - apps/provider-proxy/
  stats-web:
    carryforward: true
    paths:
      - apps/stats-web/

comment:
  layout: "diff, flags, files"
  behavior: default
  require_changes: true
  require_base: yes
  require_head: yes
  branches:
    - main
  show_carryforward_flags: true
