hostNames:
  - console-api-mainnet-staging.akash.network

replicas: 2

resources:
  limits:
    cpu: "4"
    ephemeral-storage: "2Gi"
    memory: "8Gi"
  requests:
    cpu: "0.5"
    ephemeral-storage: "0.5Gi"
    memory: "1Gi"

backgroundJobs:
  resources:
    limits:
      # Boot is CPU-bound: the chart's 500m default stretches it to 20-30s.
      cpu: 2

pgbouncer:
  enabled: true
  upstream:
    # Staging's database URIs use the instance's public IP, which stays out of this public repo.
    host: cloudsql-proxy-console-api.prod.svc.cluster.local
  # Staging shares the prod instance, so it gets a smaller share of its connection slots.
  defaultPoolSize: 10
