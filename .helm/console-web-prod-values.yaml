deploymentEnv: production

hostName: console.akash.network

# Next.js boot is a CPU burst; the chart default of 100m/1 throttles it 65 to 85% and stretches startup to 13 to 16s.
resources:
  limits:
    cpu: 2
    ephemeral-storage: 2Gi
    memory: 1Gi
  requests:
    cpu: 250m
    ephemeral-storage: 1Gi
    memory: 512Mi
