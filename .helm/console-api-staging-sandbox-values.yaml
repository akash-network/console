hostNames:
  - console-api-sandbox-staging.akash.network
jobs:
  - name: top-up-deployments
    schedule: "0 * * * *" # 0 minutes past the hour
    command:
      - node
      - --require
      - ./dist/instrumentation.js
      - dist/console.js
      - top-up-deployments
  - name: refill-wallets
    schedule: "45 * * * *" # 45 minutes past the hour
    command:
      - node
      - --require
      - ./dist/instrumentation.js
      - ./dist/console.js
      - refill-wallets
  - name: cleanup-stale-deployments
    schedule: "30 10 * * 2" # 10:30 AM every Tuesday
    command:
      - node
      - --require
      - ./dist/instrumentation.js
      - ./dist/console.js
      - cleanup-stale-deployments
  # Offset off the hour so it does not hit deployment_settings on the same minute as top-up-deployments.
  - name: notify-expiring-deployments
    schedule: "7,22,37,52 * * * *" # every 15 minutes
    command:
      - node
      - --require
      - ./dist/instrumentation.js
      - ./dist/console.js
      - notify-expiring-deployments
  # Offset from the two runtime-limit sweeps so no two of them hit deployment_settings on the same minute.
  - name: notify-unreachable-deployments
    schedule: "11,41 * * * *" # every 30 minutes
    command:
      - node
      - --require
      - ./dist/instrumentation.js
      - ./dist/console.js
      - notify-unreachable-deployments
  # Offset from the sweeps above so no two of them hit deployment_settings on the same minute.
  - name: close-unreachable-deployments
    schedule: "26 * * * *" # hourly
    command:
      - node
      - --require
      - ./dist/instrumentation.js
      - ./dist/console.js
      - close-unreachable-deployments

replicas: 2

resources:
  limits:
    cpu: "4"
    ephemeral-storage: "2Gi"
    memory: "8Gi"
  requests:
    cpu: "0.5"
    ephemeral-storage: "0.5Gi"
    memory: "1Gi"
