hostNames:
  - console-api-sandbox-staging.akash.network
jobs:
  - name: top-up-deployments
    schedule: "0 * * * *" # 0 minutes past the hour
    command:
      - node
      - --require
      - ./dist/instrumentation.js
      - dist/console.js
      - top-up-deployments
  - name: refill-wallets
    schedule: "45 * * * *" # 45 minutes past the hour
    command:
      - node
      - --require
      - ./dist/instrumentation.js
      - ./dist/console.js
      - refill-wallets
  - name: cleanup-stale-deployments
    schedule: "30 10 * * 2" # 10:30 AM every Tuesday
    command:
      - node
      - --require
      - ./dist/instrumentation.js
      - ./dist/console.js
      - cleanup-stale-deployments
  - name: close-expired-deployments
    schedule: "*/15 * * * *" # every 15 minutes
    command:
      - node
      - --require
      - ./dist/instrumentation.js
      - ./dist/console.js
      - close-expired-deployments
  # Offset from close-expired-deployments so the two sweeps do not hit deployment_settings on the same minute.
  - name: notify-expiring-deployments
    schedule: "7,22,37,52 * * * *" # every 15 minutes
    command:
      - node
      - --require
      - ./dist/instrumentation.js
      - ./dist/console.js
      - notify-expiring-deployments
  # Daily, and offset from the other deployment_settings sweeps so no two of them share a minute.
  # Object name kept short on purpose: the chart renders it as console-api-<chain>-<name> and the
  # CronJob controller caps that at 52 chars, which the CLI command name would exceed.
  - name: sweep-orphaned-definitions
    schedule: "17 3 * * *" # 03:17 every day
    # Backstop for the cleanup's own time budget, which is set lower so it stops and logs before this fires.
    # Forbid keeps a slow run from being joined by the next night's.
    concurrencyPolicy: Forbid
    activeDeadlineSeconds: 1800
    command:
      - node
      - --require
      - ./dist/instrumentation.js
      - ./dist/console.js
      - cleanup-orphaned-deployment-settings

replicas: 2

resources:
  limits:
    cpu: "4"
    ephemeral-storage: "2Gi"
    memory: "8Gi"
  requests:
    cpu: "0.5"
    ephemeral-storage: "0.5Gi"
    memory: "1Gi"
