hostNames:
  - console-api-mainnet.akash.network
  - console-api.akash.network
  - api.akash.network
jobs:
  - name: top-up-deployments
    schedule: "0 * * * *" # 0 minutes past the hour
    command:
      - node
      - --require
      - ./dist/instrumentation.js
      - ./dist/console.js
      - top-up-deployments
  - name: refill-wallets
    schedule: "45 * * * *" # 45 minutes past the hour
    command:
      - node
      - --require
      - ./dist/instrumentation.js
      - ./dist/console.js
      - refill-wallets
  - name: cleanup-stale-deployments
    schedule: "30 10,22 * * *" # 10:30 AM and 10:30 PM every day
    command:
      - node
      - --require
      - ./dist/instrumentation.js
      - ./dist/console.js
      - cleanup-stale-deployments
  - name: gpu-pricing-bot
    schedule: "0 12 * * *"
    command:
      - node
      - --require
      - ./dist/instrumentation.js
      - ./dist/console.js
      - gpu-pricing-bot
  # Ships in dry-run for a bake period: --dry-run only logs EXPIRED_DEPLOYMENT_WOULD_CLOSE.
  # Drop the flag to start closing for real once those logs look right.
  - name: close-expired-deployments
    schedule: "*/15 * * * *" # every 15 minutes
    command:
      - node
      - --require
      - ./dist/instrumentation.js
      - ./dist/console.js
      - close-expired-deployments
      - --dry-run
  # Ships in dry-run for a bake period: --dry-run only logs EXPIRING_DEPLOYMENT_WOULD_NOTIFY.
  # Drop the flag to start emailing for real once those logs look right.
  # Offset from close-expired-deployments so the two sweeps do not hit deployment_settings on the same minute.
  - name: notify-expiring-deployments
    schedule: "7,22,37,52 * * * *" # every 15 minutes
    command:
      - node
      - --require
      - ./dist/instrumentation.js
      - ./dist/console.js
      - notify-expiring-deployments
      - --dry-run
  # Ships in dry-run for a bake period: --dry-run only logs ORPHANED_DEFINITION_WOULD_SWEEP.
  # Drop the flag to start deleting for real once those logs look right. Deleting a remembered
  # definition cannot be undone, so this one bakes before it is trusted.
  # Daily, and offset from the other deployment_settings sweeps so no two of them share a minute.
  - name: sweep-orphaned-definitions
    schedule: "17 3 * * *" # 03:17 every day
    # One chain listing per owner, run one after another, so a slow or rate-limiting node stretches the run
    # rather than failing it. Forbid keeps a slow run from being joined by the next night's, and the deadline
    # ends it instead: the sweep is capped and idempotent, so a run cut short is one that made progress.
    concurrencyPolicy: Forbid
    activeDeadlineSeconds: 1800
    command:
      - node
      - --require
      - ./dist/instrumentation.js
      - ./dist/console.js
      - sweep-orphaned-definitions
      - --dry-run
  - name: mint-act
    schedule: "*/10 * * * *" # every 10 minutes
    concurrencyPolicy: Forbid
    activeDeadlineSeconds: 540
    command:
      - node
      - --require
      - ./dist/instrumentation.js
      - ./dist/console.js
      - mint-act

replicas: 3

resources:
  limits:
    cpu: 2
    ephemeral-storage: 2Gi
    memory: 4Gi
  requests:
    cpu: 250m
    ephemeral-storage: 1Gi
    memory: 1Gi
