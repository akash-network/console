# PULLFROG ACTION — DO NOT EDIT EXCEPT WHERE INDICATED
name: Pullfrog
run-name: ${{ inputs.name || github.workflow }}
on:
  workflow_dispatch:
    inputs:
      prompt:
        type: string
        description: Agent prompt
      name:
        type: string
        description: Run name

permissions:
  contents: read

jobs:
  pullfrog:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false
      - name: Run agent
        uses: pullfrog/pullfrog@ad4283a862b8377cb525a0f5bf30f17c023b18ea # v0.1.98
        with:
          prompt: ${{ inputs.prompt }}
        env:
          # AkashML through its OpenAI-compatible endpoint (https://docs.pullfrog.com/openai-compatible)
          OPENAI_COMPATIBLE_BASE_URL: https://api.akashml.com/v1
          OPENAI_COMPATIBLE_API_KEY: ${{ secrets.OPENAI_COMPATIBLE_API_KEY }}
          OPENAI_COMPATIBLE_MODEL: zai-org/GLM-5.3
          # both limits are required and must stay within what AkashML serves for this model
          OPENAI_COMPATIBLE_CONTEXT: "1000000"
          OPENAI_COMPATIBLE_MAX_OUTPUT: "32000"
