name: CI
on:
  merge_group:
  pull_request:
    branches: ["main", "main-sdk-next"]
  push:
    branches: ["main"]

# A base-branch update fires `synchronize` with before == after, so it shares neither the commit nor the
# group with the head push it arrives alongside: cancelling that run would leave its `setup` check run
# cancelled on a commit that is still the PR head, which sinks the whole rollup.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}${{ github.event_name == 'pull_request' && github.event.action == 'synchronize' && github.event.before == github.event.after && '-base-update' || '' }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
      changes: ${{ steps.changes.outputs.changes || '[]' }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - id: matrix
        run: |
          workspaces=$(find apps/* -type d -print0 -maxdepth 0 | xargs -0 -n1 basename | jq -R -s -c 'split("\n")[:-1]')
          echo 'value={"workspace":'"$workspaces"'}' >> "$GITHUB_OUTPUT"

      # One change detection for every app instead of a job per app. A push to main validates every app anyway.
      - name: List what each app's validation depends on
        id: filters
        if: github.event_name != 'push'
        run: echo "value=$(node script/app-change-filters.mjs)" >> "$GITHUB_OUTPUT"

      - name: Detect changed apps
        id: changes
        if: github.event_name != 'push'
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: ${{ steps.filters.outputs.value }}

  validate:
    needs: setup
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      fail-fast: false
    uses: ./.github/workflows/reusable-validate-app.yml
    secrets: inherit
    with:
      app: ${{ matrix.workspace }}
      has_changes: ${{ contains(fromJSON(needs.setup.outputs.changes), matrix.workspace) }}
      image_build_changes: ${{ contains(fromJSON(needs.setup.outputs.changes), format('{0}-image-build', matrix.workspace)) }}
      # api's suite takes over five minutes on one runner, so it runs in three and merges back into one report.
      test_shards: ${{ matrix.workspace == 'api' && '[1, 2, 3]' || '[1]' }}
      # provider-console's build needs packages only a whole-repo install hoists, like its image build does.
      build_on_runner: ${{ matrix.workspace == 'deploy-web' || matrix.workspace == 'stats-web' }}

  # Failed test results reach Codecov only here, once every app's result job has read its codecov/patch status:
  # Codecov sends no coverage status for any app of a commit that has a failed test.
  failed-test-results:
    needs: validate
    if: ${{ !cancelled() && needs.validate.result == 'failure' && github.event_name != 'merge_group' }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      apps: ${{ steps.list.outputs.apps }}
    steps:
      - name: List the apps whose tests failed in this attempt
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          SUFFIX: -attempt-${{ github.run_attempt }}
        run: | # shell
          apps=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
            --jq ".artifacts[].name | select(startswith(\"failed-test-results-\") and endswith(\"$SUFFIX\")) | ltrimstr(\"failed-test-results-\") | rtrimstr(\"$SUFFIX\")" \
            | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "apps=$apps" >> "$GITHUB_OUTPUT"

  upload-failed-test-results:
    needs: failed-test-results
    if: ${{ !cancelled() && needs.failed-test-results.outputs.apps != '' && needs.failed-test-results.outputs.apps != '[]' }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: ${{ fromJSON(needs.failed-test-results.outputs.apps || '[]') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .github

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: failed-test-results-${{ matrix.app }}-attempt-${{ github.run_attempt }}

      - name: Upload test results to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          report_type: test_results
          files: ./junit.xml
          disable_search: true
          name: ${{ matrix.app }}-test-results
          flags: ${{ matrix.app }}
          token: ${{ secrets.CODECOV_TOKEN }}
