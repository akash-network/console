name: CI
on:
  merge_group:
  pull_request:
    branches: ["main", "main-sdk-next"]
  push:
    branches: ["main"]

# Every pull request in a stack is resynchronised when any branch below it moves, so a single head commit is
# dispatched more than once: those runs are grouped by commit and never cancelled, because a cancelled `setup`
# check run on a commit that is still the head sinks the whole rollup. A base-branch update fires
# `synchronize` with before == after, which keeps an unstacked pull request in the same shape.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event.pull_request.stack && github.event.pull_request.head.sha || (github.event.action == 'synchronize' && github.event.before == github.event.after && 'base-update' || 'head') }}
  cancel-in-progress: ${{ !github.event.pull_request.stack }}

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.value }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - id: matrix
        run: |
          workspaces=$(find apps/* -type d -print0 -maxdepth 0 | xargs -0 -n1 basename | jq -R -s -c 'split("\n")[:-1]')
          echo 'value={"workspace":'"$workspaces"'}' >> "$GITHUB_OUTPUT"

  validate:
    needs: setup
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
      fail-fast: false
    uses: ./.github/workflows/reusable-validate-app.yml
    secrets: inherit
    with:
      app: ${{ matrix.workspace }}
