name: "CI: validate app"

on:
  workflow_call:
    inputs:
      app:
        description: "The app to release" # dir name in ./apps/*
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.app }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  should-validate:
    uses: ./.github/workflows/reusable-should-validate.yml
    with:
      path: apps/${{ inputs.app }}

  validate:
    needs: should-validate
    if: needs.should-validate.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    env:
      TEST_SCRIPT_NAME: ${{ github.event_name == 'merge_group' && 'test' || 'test:cov' }}
      # The mutation step fails when the score over the reached mutants of the changed lines drops below this.
      MUTATION_MIN_SCORE: 80
      # A diff this wide is a PR to split, not a mutation run to sit through.
      MAX_MUTATION_RANGES: 200
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: ./.github/actions/setup-app-deps
        with:
          app: ${{ inputs.app }}

      - name: Check whether app has tests
        id: tests_details
        env:
          PACKAGE_PATH: "./apps/${{ inputs.app }}/package.json"
        run: |
          read -r has_tests requires_env_setup < <(jq -r '[
            (if .scripts["${{ env.TEST_SCRIPT_NAME }}"] then "true" else "false" end),
            (if .scripts["test:ci-setup"] then "true" else "false" end)
          ] | @tsv' "$PACKAGE_PATH")
          echo "has_tests=$has_tests" >> "$GITHUB_OUTPUT"
          echo "requires_env_setup=$requires_env_setup" >> "$GITHUB_OUTPUT"

      - name: Run static code analysis
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' && steps.tests_details.outputs.has_tests != 'true'
        run: |
          npm run lint -w apps/${{ inputs.app }} -- --quiet

      - name: Ensure there are no leftovers
        if: github.event_name == 'pull_request'
        run: |
          npm run knip -- --workspace apps/${{ inputs.app }}

      - uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
        if: ${{ steps.tests_details.outputs.requires_env_setup == 'true' }}

      - name: Normalize branch name
        if: ${{ steps.tests_details.outputs.requires_env_setup == 'true' }}
        run: |
          BRANCH_NAME_SAFE="${GITHUB_REF_NAME//\//-}"
          echo "BRANCH_NAME_SAFE=${BRANCH_NAME_SAFE:-main}" >> "$GITHUB_ENV"

      - name: Prepare tests environment
        if: ${{ steps.tests_details.outputs.requires_env_setup == 'true' }}
        env:
          USE_DOCKER_BUILDKIT: 1
          DOCKER_BUILDKIT_CACHE_SCOPE: ${{ github.workflow }}-${{ inputs.app }}
          DOCKER_BUILDKIT_CACHE_FALLBACK_SCOPE: ${{ github.workflow }}-${{ inputs.app }}-${{ env.BRANCH_NAME_SAFE }}
          BUILDX_BAKE_ENTITLEMENTS_FS: 0
          POSTGRES_SKIP_IMPORT: "true"
        run: |
          npm run --if-present --workspace=apps/${{ inputs.app }} test:ci-setup

      - name: Run tests
        if: ${{ steps.tests_details.outputs.has_tests == 'true' }}
        run: npm run "$TEST_SCRIPT_NAME" --workspace=apps/${{ inputs.app }}

      - name: Find mutation testing targets
        id: mutation_targets
        if: ${{ github.event_name == 'pull_request' && steps.tests_details.outputs.has_tests == 'true' && !contains(github.event.pull_request.labels.*.name, 'ignore-mutations-testing') }}
        env:
          APP_PATH: apps/${{ inputs.app }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: | # shell
          # The checkout is the merge commit, so its first parent is the base tip: diffing against it
          # leaves out whatever landed on the base branch after the PR was opened.
          git fetch --no-tags --depth=2 origin "+$MERGE_REF:$MERGE_REF" || true

          if git cat-file -e "HEAD^1^{commit}" 2> /dev/null; then
            base=HEAD^1
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            base="$BASE_SHA"
          fi

          node script/mutation-targets.mjs "$APP_PATH" "$base" --out mutation-targets.json

          jq -r '"mutate=\(.mutate)", "ranges=\(.ranges)", "test_env=\(.testEnv)"' mutation-targets.json >> "$GITHUB_OUTPUT"

          skip=$(jq -r '.skip // empty' mutation-targets.json)
          if [[ -n "$skip" ]]; then
            echo "Mutation testing skipped: $skip." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run mutation testing
        if: ${{ steps.mutation_targets.outputs.mutate != '' }}
        working-directory: apps/${{ inputs.app }}
        env:
          APP: ${{ inputs.app }}
          MUTATE: ${{ steps.mutation_targets.outputs.mutate }}
          TEST_ENV: ${{ steps.mutation_targets.outputs.test_env }}
          RANGES: ${{ steps.mutation_targets.outputs.ranges }}
          STRYKER_JSON_REPORT: ${{ github.workspace }}/mutation-report.json
        run: | # shell
          status=0
          # $TEST_ENV is an unquoted list of KEY=value tokens on purpose: `env` applies them, and nothing else gets re-parsed.
          # shellcheck disable=SC2086
          env $TEST_ENV npx stryker run "$GITHUB_WORKSPACE/stryker.config.mjs" --mutate "$MUTATE" || status=$?

          score_status=0
          summary=$(node "$GITHUB_WORKSPACE/script/mutation-report.mjs" "$STRYKER_JSON_REPORT" \
            --min "$MUTATION_MIN_SCORE" \
            --reproduce "cd apps/$APP && npx stryker run ../../stryker.config.mjs --mutate '$MUTATE'") || score_status=$?

          {
            echo "### Mutation testing: $APP"
            echo
            echo "Mutated $RANGES changed line range(s), scoped to the files the app measures coverage on."
            echo
            echo "$summary"
            echo
            echo "Add the \`ignore-mutations-testing\` label to skip this check."
          } >> "$GITHUB_STEP_SUMMARY"

          if (( status != 0 )); then exit $status; fi
          exit $score_status

      - name: Teardown tests environment
        if: ${{ always() && steps.tests_details.outputs.requires_env_setup == 'true' }}
        run: npm run --if-present --workspace=apps/${{ inputs.app }} test:ci-teardown

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && steps.tests_details.outputs.has_tests == 'true' && github.event_name != 'merge_group' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          report_type: test_results
          files: ./junit.xml
          name: ${{ inputs.app }}-test-results
          flags: ${{ inputs.app }}
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Upload Test Coverage
        if: steps.tests_details.outputs.has_tests == 'true' && github.event_name != 'merge_group'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          fail_ci_if_error: true
          directory: ./apps/${{ inputs.app }}/coverage
          flags: ${{ inputs.app }}
          token: ${{ secrets.CODECOV_TOKEN }}

  test-build:
    runs-on: ubuntu-latest
    needs: should-validate
    if: needs.should-validate.outputs.has_changes == 'true'

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Build the Docker image for API
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # to not install node_modules inside this job
          mkdir -p node_modules/.bin
          ln -s "$PWD/packages/docker/script/dc.sh" node_modules/.bin/dc
          npm run -w apps/${{ inputs.app }} build:container

  result:
    runs-on: ubuntu-latest
    needs: [should-validate, validate, test-build]
    if: always()
    permissions:
      contents: read
      checks: read
    steps:
      - name: Checkout gha
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          sparse-checkout: |
            .github
      - name: Conditionally required codecov/patch check
        if: >-
          needs.validate.result == 'success' && github.event_name == 'pull_request' && (
            inputs.app == 'api' ||
            inputs.app == 'deploy-web' ||
            inputs.app == 'notifications' ||
            inputs.app == 'provider-proxy'
          )
        uses: ./.github/actions/poll-check-status
        with:
          name: codecov/patch/${{ inputs.app }}
          sha: ${{ github.event.pull_request.head.sha }}

      - name: Check statuses
        env:
          VALIDATE_RESULT: ${{ needs.validate.result }}
          TEST_BUILD_RESULT: ${{ needs.test-build.result }}
        run: |
          echo "Validate: $VALIDATE_RESULT"
          echo "Test Build: $TEST_BUILD_RESULT"

          is_validation_ok=$(echo "$VALIDATE_RESULT" | grep -q -E "^(success|skipped)$" && echo "true" || echo "false")
          is_test_build_ok=$(echo "$TEST_BUILD_RESULT" | grep -q -E "^(success|skipped)$" && echo "true" || echo "false")

          if [[ "$is_validation_ok" != "true" || "$is_test_build_ok" != "true" ]]; then
            exit 1
          fi
