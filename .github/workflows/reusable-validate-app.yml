name: "CI: validate app"

on:
  workflow_call:
    inputs:
      app:
        description: "The app to release" # dir name in ./apps/*
        required: true
        type: string
      has_changes:
        description: "Whether the pull request or merge group changed anything the app's validation depends on"
        required: false
        type: boolean
        default: true
      image_build_changes:
        description: "Whether the pull request or merge group changed a file the app's image build reads besides its source code"
        required: false
        type: boolean
        default: false
      test_shards:
        description: "JSON list of the shards the app's test suite runs in, one runner each"
        required: false
        type: string
        default: "[1]"
      build_on_runner:
        description: "Whether test-build may run the app's build script on the runner instead of building its image"
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.app }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

env:
  APP_TO_VALIDATE: ${{ inputs.app }}
  TEST_SCRIPT_NAME: ${{ github.event_name == 'merge_group' && 'test' || 'test:cov' }}

# Static analysis, tests and mutation testing run as separate jobs so the slowest one sets the wall clock
# instead of all three adding up.
jobs:
  static-analysis:
    if: github.event_name == 'push' || inputs.has_changes
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-app-deps
        with:
          app: ${{ inputs.app }}

      - name: Check whether app has tests
        id: tests_details
        env:
          PACKAGE_PATH: "./apps/${{ inputs.app }}/package.json"
        run: |
          has_tests=$(jq -r --arg script "$TEST_SCRIPT_NAME" 'if .scripts[$script] then "true" else "false" end' "$PACKAGE_PATH")
          echo "has_tests=$has_tests" >> "$GITHUB_OUTPUT"

      # The per-run key never pre-exists, so every run saves a fresh cache; restore-keys picks up the
      # newest previous one. The prefix hashes the lockfile and shared eslint config sources because
      # ESLint's cache does not invalidate itself on plugin or config-package upgrades.
      - name: Restore ESLint cache
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' && steps.tests_details.outputs.has_tests != 'true'
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: apps/${{ inputs.app }}/.eslintcache
          key: eslint-${{ inputs.app }}-${{ runner.os }}-${{ hashFiles('package-lock.json', 'packages/dev-config/eslint/**', 'packages/dev-config/eslint-plugin-akash/**') }}-${{ github.sha }}
          restore-keys: |
            eslint-${{ inputs.app }}-${{ runner.os }}-${{ hashFiles('package-lock.json', 'packages/dev-config/eslint/**', 'packages/dev-config/eslint-plugin-akash/**') }}-

      - name: Run static code analysis
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group' && steps.tests_details.outputs.has_tests != 'true'
        run: |
          npm run lint -w "apps/$APP_TO_VALIDATE" -- --quiet --cache --cache-location .eslintcache --cache-strategy content

      - name: Ensure there are no leftovers
        if: github.event_name == 'pull_request'
        run: |
          npm run knip -- --workspace "apps/$APP_TO_VALIDATE"

      # Apps opt in by exposing a `validate:types` script; the others short-circuit until they can pass it.
      - name: Validate types
        run: |
          npm run --if-present validate:types --workspace="apps/$APP_TO_VALIDATE"

  tests:
    if: github.event_name == 'push' || inputs.has_changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(inputs.test_shards) }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check whether app has tests
        id: tests_details
        env:
          PACKAGE_PATH: "./apps/${{ inputs.app }}/package.json"
        run: |
          read -r has_tests requires_env_setup < <(jq -r --arg script "$TEST_SCRIPT_NAME" '[
            (if .scripts[$script] then "true" else "false" end),
            (if .scripts["test:ci-setup"] then "true" else "false" end)
          ] | @tsv' "$PACKAGE_PATH")
          echo "has_tests=$has_tests" >> "$GITHUB_OUTPUT"
          echo "requires_env_setup=$requires_env_setup" >> "$GITHUB_OUTPUT"

      - name: Normalize branch name
        if: ${{ steps.tests_details.outputs.requires_env_setup == 'true' }}
        run: |
          BRANCH_NAME_SAFE="${GITHUB_REF_NAME//\//-}"
          echo "BRANCH_NAME_SAFE=${BRANCH_NAME_SAFE:-main}" >> "$GITHUB_ENV"

      # Starts before the dependencies are restored so the containers come up while they do. node_modules does
      # not exist yet, so a shim puts the docker package's `dc` on PATH for the app's `test:ci-setup` script,
      # which creates the buildx builder it needs itself.
      - name: Start tests environment
        id: start_tests_env
        if: ${{ steps.tests_details.outputs.requires_env_setup == 'true' }}
        env:
          USE_DOCKER_BUILDKIT: 1
          DOCKER_BUILDKIT_CACHE_SCOPE: ${{ github.workflow }}-${{ inputs.app }}
          DOCKER_BUILDKIT_CACHE_FALLBACK_SCOPE: ${{ github.workflow }}-${{ inputs.app }}-${{ env.BRANCH_NAME_SAFE }}
          BUILDX_BAKE_ENTITLEMENTS_FS: 0
          POSTGRES_SKIP_IMPORT: "true"
        run: | # shell
          mkdir -p "$RUNNER_TEMP/test-env-bin"
          ln -sf "$GITHUB_WORKSPACE/packages/docker/script/dc.sh" "$RUNNER_TEMP/test-env-bin/dc"
          (
            status=0
            PATH="$RUNNER_TEMP/test-env-bin:$PATH" npm run --if-present --workspace="apps/$APP_TO_VALIDATE" test:ci-setup > "$RUNNER_TEMP/test-env.log" 2>&1 || status=$?
            echo "$status" > "$RUNNER_TEMP/test-env.status.tmp"
            mv "$RUNNER_TEMP/test-env.status.tmp" "$RUNNER_TEMP/test-env.status"
          ) < /dev/null > /dev/null 2>&1 &

      - uses: ./.github/actions/setup-app-deps
        if: ${{ steps.tests_details.outputs.has_tests == 'true' }}
        with:
          app: ${{ inputs.app }}

      # Also runs after a failed dependency restore, so the teardown never races containers that are still starting.
      - name: Wait for tests environment
        if: ${{ !cancelled() && steps.start_tests_env.outcome == 'success' }}
        timeout-minutes: 5
        run: | # shell
          until [[ -f "$RUNNER_TEMP/test-env.status" ]]; do sleep 1; done
          cat "$RUNNER_TEMP/test-env.log"
          exit "$(cat "$RUNNER_TEMP/test-env.status")"

      - name: Run tests
        id: run_tests
        if: ${{ steps.tests_details.outputs.has_tests == 'true' }}
        env:
          SHARD: ${{ matrix.shard }}
          SHARD_COUNT: ${{ strategy.job-total }}
        run: | # shell
          shard_args=()
          if (( SHARD_COUNT > 1 )); then
            shard_args=(--shard="$SHARD/$SHARD_COUNT")
            # merge-test-reports turns the shards' blob reports back into one coverage and junit report.
            if [[ "$GITHUB_EVENT_NAME" != "merge_group" ]]; then
              shard_args+=(--reporter=blob --outputFile.blob="test-reports/blob-$SHARD-$SHARD_COUNT.json")
            fi
          fi
          npm run "$TEST_SCRIPT_NAME" --workspace="apps/$APP_TO_VALIDATE" -- "${shard_args[@]}"

      - name: Teardown tests environment
        if: ${{ always() && steps.tests_details.outputs.requires_env_setup == 'true' }}
        run: npm run --if-present --workspace="apps/$APP_TO_VALIDATE" test:ci-teardown

      # Vitest writes the blob when tests fail too, so a failing shard still reaches Codecov's test results.
      - name: Upload test report shard
        if: ${{ !cancelled() && steps.run_tests.outcome != 'skipped' && strategy.job-total > 1 && github.event_name != 'merge_group' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-reports-${{ inputs.app }}-${{ matrix.shard }}
          path: apps/${{ inputs.app }}/test-reports/
          if-no-files-found: error
          retention-days: 1
          # A re-run of a failed shard uploads it again, and merge-test-reports needs that newer blob.
          overwrite: true

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && steps.run_tests.outcome == 'success' && strategy.job-total == 1 && github.event_name != 'merge_group' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          report_type: test_results
          files: ./junit.xml
          name: ${{ inputs.app }}-test-results
          flags: ${{ inputs.app }}
          token: ${{ secrets.CODECOV_TOKEN }}

      # Codecov sends no coverage status for any app of a commit once it has a failed test, so all-ci.yml only
      # uploads these after every app's result job has read its codecov/patch status.
      - name: Keep failed test results for after the coverage checks
        if: ${{ !cancelled() && steps.run_tests.outcome == 'failure' && strategy.job-total == 1 && github.event_name != 'merge_group' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failed-test-results-${{ inputs.app }}-attempt-${{ github.run_attempt }}
          path: apps/${{ inputs.app }}/junit.xml
          if-no-files-found: warn
          retention-days: 1

      - name: Upload Test Coverage
        if: steps.tests_details.outputs.has_tests == 'true' && strategy.job-total == 1 && github.event_name != 'merge_group'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          fail_ci_if_error: true
          directory: ./apps/${{ inputs.app }}/coverage
          flags: ${{ inputs.app }}
          token: ${{ secrets.CODECOV_TOKEN }}

  # One Codecov upload per commit and flag, because Codecov can post codecov/patch from the first shard's
  # upload alone, and the result job would read that partial verdict.
  merge-test-reports:
    needs: tests
    if: ${{ !cancelled() && needs.tests.result != 'skipped' && inputs.test_shards != '[1]' && github.event_name != 'merge_group' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-app-deps
        with:
          app: ${{ inputs.app }}

      - name: Download test report shards
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: test-reports-${{ inputs.app }}-*
          path: apps/${{ inputs.app }}/test-reports
          merge-multiple: true

      - name: Merge test reports
        working-directory: apps/${{ inputs.app }}
        run: npx vitest run --merge-reports=test-reports --coverage --reporter=default --reporter=junit

      - name: Upload test results to Codecov
        if: ${{ !cancelled() && needs.tests.result == 'success' }}
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          report_type: test_results
          files: ./junit.xml
          name: ${{ inputs.app }}-test-results
          flags: ${{ inputs.app }}
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Keep failed test results for after the coverage checks
        if: ${{ !cancelled() && needs.tests.result == 'failure' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: failed-test-results-${{ inputs.app }}-attempt-${{ github.run_attempt }}
          path: apps/${{ inputs.app }}/junit.xml
          if-no-files-found: warn
          retention-days: 1

      - name: Upload Test Coverage
        if: needs.tests.result == 'success'
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          fail_ci_if_error: true
          directory: ./apps/${{ inputs.app }}/coverage
          flags: ${{ inputs.app }}
          token: ${{ secrets.CODECOV_TOKEN }}

  mutation-testing:
    if: ${{ inputs.has_changes && github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ignore-mutations-testing') }}
    runs-on: ubuntu-latest
    env:
      # The mutation step fails when the score over the reached mutants of the changed lines drops below this.
      MUTATION_MIN_SCORE: 80
      # A diff this wide is a PR to split, not a mutation run to sit through.
      MAX_MUTATION_RANGES: 200
      # The hosted runner has four vCPUs, and the config's default of two test runners leaves half of them idle.
      STRYKER_CONCURRENCY: 4
      STRYKER_INCREMENTAL_FILE: ${{ github.workspace }}/stryker-incremental.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Check whether app has tests
        id: tests_details
        env:
          PACKAGE_PATH: "./apps/${{ inputs.app }}/package.json"
        run: |
          has_tests=$(jq -r --arg script "$TEST_SCRIPT_NAME" 'if .scripts[$script] then "true" else "false" end' "$PACKAGE_PATH")
          echo "has_tests=$has_tests" >> "$GITHUB_OUTPUT"

      - uses: ./.github/actions/setup-app-deps
        if: ${{ steps.tests_details.outputs.has_tests == 'true' }}
        with:
          app: ${{ inputs.app }}

      - name: Find mutation testing targets
        id: mutation_targets
        if: ${{ steps.tests_details.outputs.has_tests == 'true' }}
        env:
          APP_PATH: apps/${{ inputs.app }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_REF: refs/pull/${{ github.event.pull_request.number }}/merge
        run: | # shell
          # The checkout is the merge commit, so its first parent is the base tip: diffing against it
          # leaves out whatever landed on the base branch after the PR was opened.
          git fetch --no-tags --depth=2 origin "+$MERGE_REF:$MERGE_REF" || true

          if git cat-file -e "HEAD^1^{commit}" 2> /dev/null; then
            base=HEAD^1
          else
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            base="$BASE_SHA"
          fi

          node script/mutation-targets.mjs "$APP_PATH" "$base" --out mutation-targets.json

          jq -r '"mutate=\(.mutate)", "ranges=\(.ranges)", "test_files=\(.testFiles)", "test_env=\(.testEnv)"' mutation-targets.json >> "$GITHUB_OUTPUT"

          skip=$(jq -r '.skip // empty' mutation-targets.json)
          if [[ -n "$skip" ]]; then
            echo "Mutation testing skipped: $skip." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Each push of a pull request reuses the previous push's result for every mutant whose code and covering
      # tests did not change, so only the lines touched since then pay for a mutation run again.
      - name: Restore mutation results of earlier pushes
        if: ${{ steps.mutation_targets.outputs.mutate != '' }}
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.STRYKER_INCREMENTAL_FILE }}
          key: stryker-incremental-${{ inputs.app }}-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            stryker-incremental-${{ inputs.app }}-pr-${{ github.event.pull_request.number }}-

      - name: Run mutation testing
        if: ${{ steps.mutation_targets.outputs.mutate != '' }}
        working-directory: apps/${{ inputs.app }}
        env:
          MUTATE: ${{ steps.mutation_targets.outputs.mutate }}
          TEST_FILES: ${{ steps.mutation_targets.outputs.test_files }}
          TEST_ENV: ${{ steps.mutation_targets.outputs.test_env }}
          RANGES: ${{ steps.mutation_targets.outputs.ranges }}
          STRYKER_JSON_REPORT: ${{ github.workspace }}/mutation-report.json
        run: | # shell
          status=0
          # $TEST_ENV is an unquoted list of KEY=value tokens on purpose: `env` applies them, and nothing else gets re-parsed.
          # shellcheck disable=SC2086
          env $TEST_ENV npx stryker run "$GITHUB_WORKSPACE/stryker.config.mjs" --mutate "$MUTATE" --testFiles "$TEST_FILES" \
            --incremental --incrementalFile "$STRYKER_INCREMENTAL_FILE" || status=$?

          score_status=0
          summary=$(node "$GITHUB_WORKSPACE/script/mutation-report.mjs" "$STRYKER_JSON_REPORT" \
            --min "$MUTATION_MIN_SCORE" \
            --reproduce "cd apps/$APP_TO_VALIDATE && npx stryker run ../../stryker.config.mjs --mutate '$MUTATE' --testFiles '$TEST_FILES'") || score_status=$?

          {
            echo "### Mutation testing: $APP_TO_VALIDATE"
            echo
            # A fenced block, not an inline code span: the spec paths come from PR-controlled file names,
            # and a backtick in one would otherwise close the span and let raw markdown into the summary.
            echo "Mutated $RANGES changed line range(s), scoped to the files the app measures coverage on, against their own specs:"
            echo
            echo '```'
            echo "$TEST_FILES"
            echo '```'
            echo
            echo "$summary"
            echo
            echo "Add the \`ignore-mutations-testing\` label to skip this check."
          } >> "$GITHUB_STEP_SUMMARY"

          if (( status != 0 )); then exit $status; fi
          exit $score_status

      - name: Save mutation results for later pushes
        if: ${{ !cancelled() && steps.mutation_targets.outputs.mutate != '' }}
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ env.STRYKER_INCREMENTAL_FILE }}
          key: stryker-incremental-${{ inputs.app }}-pr-${{ github.event.pull_request.number }}-${{ github.run_id }}-${{ github.run_attempt }}

  test-build:
    runs-on: ubuntu-latest
    if: ${{ (github.event_name == 'pull_request' || github.event_name == 'merge_group') && inputs.has_changes }}

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      # Installing dependencies inside the image took over a minute on its own, so an app that allows it builds on
      # the runner from the cached dependencies unless something only the image build reads has changed.
      - name: Decide how to build
        id: build_mode
        env:
          BUILD_ON_RUNNER: ${{ inputs.build_on_runner }}
          IMAGE_BUILD_CHANGES: ${{ inputs.image_build_changes }}
        run: | # shell
          if [[ "$BUILD_ON_RUNNER" == "true" && "$IMAGE_BUILD_CHANGES" != "true" ]]; then
            echo "mode=runner" >> "$GITHUB_OUTPUT"
          else
            echo "mode=image" >> "$GITHUB_OUTPUT"
          fi

      - uses: ./.github/actions/setup-app-deps
        if: steps.build_mode.outputs.mode == 'runner'
        with:
          app: ${{ inputs.app }}

      - name: Build the app
        if: steps.build_mode.outputs.mode == 'runner'
        env:
          NODE_ENV: production
          DEPLOYMENT_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
        run: npm run build -w "apps/$APP_TO_VALIDATE"

      - name: Build the Docker image for API
        if: steps.build_mode.outputs.mode == 'image'
        env:
          GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # to not install node_modules inside this job
          mkdir -p node_modules/.bin
          ln -s "$PWD/packages/docker/script/dc.sh" node_modules/.bin/dc
          npm run -w "apps/$APP_TO_VALIDATE" build:container

  result:
    runs-on: ubuntu-latest
    needs: [static-analysis, tests, merge-test-reports, mutation-testing, test-build]
    if: always()
    permissions:
      contents: read
      checks: read
    steps:
      - name: Checkout gha
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: |
            .github
      # Skipped once another job failed: the check fails regardless, and there is no point waiting for Codecov first.
      - name: Conditionally required codecov/patch check
        if: >-
          needs.tests.result == 'success' && !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled')
          && github.event_name == 'pull_request' && (
            inputs.app == 'api' ||
            inputs.app == 'deploy-web' ||
            inputs.app == 'notifications' ||
            inputs.app == 'provider-proxy'
          )
        uses: ./.github/actions/poll-check-status
        with:
          name: codecov/patch/${{ inputs.app }}
          sha: ${{ github.event.pull_request.head.sha }}
          # Codecov usually posts within half a minute of the upload; the budget covers the ones that land later.
          retry_delay: 10000
          max_retries: 30

      - name: Check statuses
        env:
          STATIC_ANALYSIS_RESULT: ${{ needs.static-analysis.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
          MERGE_TEST_REPORTS_RESULT: ${{ needs.merge-test-reports.result }}
          MUTATION_TESTING_RESULT: ${{ needs.mutation-testing.result }}
          TEST_BUILD_RESULT: ${{ needs.test-build.result }}
        run: |
          echo "Static analysis: $STATIC_ANALYSIS_RESULT"
          echo "Tests: $TESTS_RESULT"
          echo "Merge test reports: $MERGE_TEST_REPORTS_RESULT"
          echo "Mutation testing: $MUTATION_TESTING_RESULT"
          echo "Test Build: $TEST_BUILD_RESULT"

          for result in "$STATIC_ANALYSIS_RESULT" "$TESTS_RESULT" "$MERGE_TEST_REPORTS_RESULT" "$MUTATION_TESTING_RESULT" "$TEST_BUILD_RESULT"; do
            if [[ "$result" != "success" && "$result" != "skipped" ]]; then
              exit 1
            fi
          done
