name: Release app
on:
  push:
    branches: ["main"]
    paths:
      - "apps/**/*"
      - "packages/**/*"
  workflow_dispatch:
    inputs:
      sha:
        description: "The commit SHA to release (defaults to GITHUB_SHA)"
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read
  checks: read
  actions: write

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      backends: ${{ steps.matrix.outputs.backends }}
      nextjs: ${{ steps.matrix.outputs.nextjs }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Detect changed apps
        id: matrix
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PUSHED_FROM_SHA: ${{ github.event.before }}
          DISPATCH_SHA: ${{ inputs.sha }}
        # shellcheck disable=SC2016
        run: | # shell
          if [[ "${GITHUB_EVENT_NAME}" != "workflow_dispatch" ]]; then
            pushed_shas=$(gh api "repos/$GITHUB_REPOSITORY/compare/$PUSHED_FROM_SHA...$GITHUB_SHA" --jq '.commits[].sha' || true)
            if [[ -z "$pushed_shas" ]]; then
              pushed_shas="$GITHUB_SHA"
            fi
            for pushed_sha in $pushed_shas; do
              gh api "repos/$GITHUB_REPOSITORY/commits/$pushed_sha" --jq '{ sha: .sha, files: [.files[].filename] }'
            done | jq -s '.' > pushed_commits.json
          fi
          node --input-type=module -e '
            import fs from "fs";
            import { findLocalPackageDependencies } from "./packages/releaser/find-local-package-dependencies.js";

            const apps = fs.readdirSync("./apps").map(app => ({ app, paths: ["apps/" + app, ...findLocalPackageDependencies("apps/" + app)] }));

            // release every app in case of workflow_dispatch, otherwise every app each pushed commit changed
            const pushedCommits = process.env.GITHUB_EVENT_NAME === "workflow_dispatch"
              ? [{ sha: process.env.DISPATCH_SHA || "", files: apps.map(({ app }) => "apps/" + app + "/") }]
              : JSON.parse(fs.readFileSync("./pushed_commits.json", "utf-8"));

            const releases = pushedCommits.flatMap(({ sha, files }) =>
              apps.filter(({ paths }) => files.some(f => paths.some(p => f.startsWith(p + "/")))).map(({ app }) => ({ app, sha }))
            );

            const isNextjs = app => fs.readdirSync("apps/" + app).some(f => f.startsWith("next.config"));
            const nextjs = releases.filter(({ app }) => isNextjs(app));
            const backends = releases.filter(({ app }) => !isNextjs(app) && app !== "log-collector");

            console.log("nextjs=" + JSON.stringify({ include: nextjs }));
            console.log("backends=" + JSON.stringify({ include: backends }));
          ' >> "$GITHUB_OUTPUT"

  release-backends:
    needs: setup
    if: fromJson(needs.setup.outputs.backends).include[0]
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.backends) }}
      fail-fast: false
    uses: ./.github/workflows/reusable-release-app.yml
    secrets: inherit
    permissions:
      contents: write
      packages: write
      actions: write
    with:
      app: ${{ matrix.app }}
      sha: ${{ matrix.sha }}

  release-nextjs:
    needs: setup
    if: fromJson(needs.setup.outputs.nextjs).include[0]
    strategy:
      matrix: ${{ fromJson(needs.setup.outputs.nextjs) }}
      fail-fast: false
    uses: ./.github/workflows/reusable-release-nextjs-app.yml
    secrets: inherit
    permissions:
      contents: write
      packages: write
      actions: write
    with:
      app: ${{ matrix.app }}
      sha: ${{ matrix.sha }}
