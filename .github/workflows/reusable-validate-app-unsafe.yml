# We need a separate workflow to get access to secrets because github doesn't share secrets on pull_request events.
# https://docs.github.com/en/actions/reference/events-that-trigger-workflows#pull_request_target
#
# !!!! PLEASE be extra careful here and treat forked repository as untrusted user input !!!!

name: "CI: validate app unsafe"

on:
  workflow_call:
    inputs:
      path:
        description: "The path to the workspace to validate"
        required: true
        type: string
      sha:
        description: "The commit to scan"
        required: true
        type: string
    secrets:
      gh-token:
        description: "github token used to fetch changed files in PR"
        required: true
      snyk-token:
        description: "snyk token used to test code for security issues"
        required: true

permissions:
  contents: read
  pull-requests: read

jobs:
  validate-unsafe:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout trusted ignore rules
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: .dcignore
          sparse-checkout-cone-mode: false
          path: ./trusted
      - name: Checkout UNTRUSTED commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          ref: ${{ inputs.sha }}
          path: ./untrusted-user-fork
      - name: Copy .dcignore
        shell: bash
        env:
          APP_PATH: ${{ inputs.path }}
        run: | # shell
          checkout_dir=$(realpath ./untrusted-user-fork)
          app_dir=$(realpath "./untrusted-user-fork/$APP_PATH")
          if [[ "$app_dir" != "$checkout_dir/"* ]]; then
            echo "::error::$APP_PATH resolves outside the checked out commit"
            exit 1
          fi
          cp --remove-destination ./trusted/.dcignore "$app_dir/.dcignore"
      - name: Test code for security issues
        uses: snyk/actions/node@4a528b5c534bb771b6e3772656a8e0e9dc902f8b
        env:
          SNYK_TOKEN: ${{ secrets.snyk-token }}
        with:
          command: code
          args: test ./untrusted-user-fork/${{ inputs.path }} --severity-threshold=medium
