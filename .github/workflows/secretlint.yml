name: Secretlint

on:
  pull_request:
    branches: ["main", "main-sdk-next"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secretlint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: package.json

      - name: Install dependencies
        run: npm run safe-install -- --include-workspace-root -w packages/dev-config

      - name: Lint changed files for secrets
        run: |
          git diff --name-only --diff-filter=d -z HEAD^1 HEAD |
            xargs -0 --no-run-if-empty npx secretlint --no-glob
