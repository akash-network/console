name: 'Poll check status'
description: 'Polls the status of a check run with the given name and waits until it completes'

inputs:
  name:
    description: 'Check name to check status for'
    required: true
  sha:
    description: 'SHA to check the status on (defaults to the workflow run head SHA)'
    required: false
  expected_conclusions:
    description: 'Expected conclusions of the check (e.g., success, failure or "success;neutral"). If not provided, any completed status is accepted.'
    required: false
    default: "success"
  pending_conclusions:
    description: 'Conclusions of a completed check that can still change, polled again like an unfinished check (e.g., "neutral")'
    required: false
    default: ""
  check_type:
    description: 'Type of check: "check_run" (Checks API) or "status" (Status API)'
    required: false
    default: "check_run"
  retry_delay:
    description: 'Delay between retries in milliseconds'
    required: false
    default: "30000"
  max_retries:
    description: 'Maximum number of retries before giving up'
    required: false
    default: "5"
runs:
  using: "composite"
  steps:
    - name: 'Poll check status'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      env:
        CHECK_NAME: ${{ inputs.name }}
        CHECK_SHA: ${{ inputs.sha || github.sha }}
        CHECK_TYPE: ${{ inputs.check_type }}
        SLEEP_TIMEOUT: ${{ inputs.retry_delay }}
        MAX_RETRIES: ${{ inputs.max_retries }}
        EXPECTED_CONCLUSIONS: ${{ inputs.expected_conclusions }}
        PENDING_CONCLUSIONS: ${{ inputs.pending_conclusions }}
      with:
        script: | # js
          const checkName = process.env.CHECK_NAME;
          const sha = process.env.CHECK_SHA;
          const checkType = process.env.CHECK_TYPE;
          const maxRetries = Number(process.env.MAX_RETRIES);
          const sleepMs = Number(process.env.SLEEP_TIMEOUT);
          const expectedConclusions = process.env.EXPECTED_CONCLUSIONS.split(";").map(s => s.trim());
          const pendingConclusions = process.env.PENDING_CONCLUSIONS.split(";").map(s => s.trim()).filter(Boolean);

          console.log(`Checking ${checkName} for SHA=${sha} (type: ${checkType})`);

          const getCheckStatus = checkType === 'status' ? getStatus : getCheckRun;
          const checksParams = {
            owner: context.repo.owner,
            repo: context.repo.repo,
            ref: sha,
          };

          for (let attempt = 0; attempt < maxRetries; attempt++) {
            const check = await getCheckStatus();

            if (check?.status !== 'completed') {
              if (attempt < maxRetries - 1) {
                const logPrefix = check ? `Check ${checkName} status: ${check.status}` : `Check ${checkName} not found yet`;
                console.log(`${logPrefix}. Retry ${attempt + 1}/${maxRetries} in ${sleepMs / 1000}s...`);
                await new Promise(resolve => setTimeout(resolve, sleepMs));
                continue;
              }
              const statusMsg = check ? `status: ${check.status}` : 'not found';
              throw new Error(`${checkName} check did not complete after ${maxRetries} attempts (${statusMsg})`);
            }

            if (pendingConclusions.includes(check.conclusion)) {
              if (attempt < maxRetries - 1) {
                console.log(`Check ${checkName} conclusion=${check.conclusion} can still change. Retry ${attempt + 1}/${maxRetries} in ${sleepMs / 1000}s...`);
                await new Promise(resolve => setTimeout(resolve, sleepMs));
                continue;
              }
              throw new Error(`${checkName} conclusion=${check.conclusion} after ${maxRetries} attempts`);
            }

            if (!expectedConclusions.includes(check.conclusion)) {
              throw new Error(`${checkName} conclusion=${check.conclusion}`);
            }

            console.log(`${checkName} is success ✅`);
            break;
          }

          async function getCheckRun() {
            const { data } = await github.rest.checks.listForRef({
              ...checksParams,
              check_name: checkName
            });

            // A run cancelled by a newer one for the same commit leaves its check run in progress for good.
            const check = data.check_runs.reduce((newest, run) => (!newest || run.id > newest.id ? run : newest), null);
            if (!check) return null;

            return {
              status: check.status,
              conclusion: check.conclusion
            };
          }

          async function getStatus() {
            const { data } = await github.rest.repos.getCombinedStatusForRef(checksParams);

            const status = data.statuses.find(s => s.context === checkName);
            if (!status) return null;

            const isCompleted = ['success', 'failure', 'error'].includes(status.state);
            let conclusion = status.state === 'success' ? 'success' : (isCompleted ? 'failure' : null);
            if (status.state === 'error' && status.description.includes('have used your limit')) {
              conclusion = 'neutral'; // treat Snyk errors due to free tier limits as neutral
            }

            return {
              status: isCompleted ? 'completed' : 'in_progress',
              conclusion,
            };
          }
