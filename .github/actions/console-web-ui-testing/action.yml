name: Console Web UI testing
description: Runs UI tests for Console Web

inputs:
  ref:
    description: Git ref related to the tests (e.g., console-web/v1.2.3)
    required: true
  url:
    description: Base URL to Console Web
    required: true
  slack-webhook-url:
    description: Slack webhook URL
    required: false
  gh-user-to-slack-user:
    description: GitHub user to Slack user mapping
    required: false
    default: "{}"
  testing-client-token:
    description: E2E testing client token which allows to bypass captcha verification
    required: true
  auth0-m2m-domain:
    description: Auth0 M2M domain for management API calls
    required: true
  auth0-m2m-client-id:
    description: Auth0 M2M client ID
    required: true
  auth0-m2m-client-secret:
    description: Auth0 M2M client secret
    required: true
  e2e-inbox-api-url:
    description: Base URL of the e2e inbox worker that captures OTP emails (see https://github.com/akash-network/e2e-inbox-worker)
    required: true
  e2e-inbox-api-token:
    description: Bearer token for the e2e inbox worker HTTP endpoint
    required: true
  e2e-inbox-email-domain:
    description: Email domain routed to the e2e inbox worker (dedicated domain, e.g. e2e.example.com)
    required: true
  test-user-email:
    description: Pre-registered test user email for authenticated tests
    required: false
  test-user-password:
    description: Pre-registered test user password for authenticated tests
    required: false

runs:
  using: "composite"
  steps:
    - uses: ./.github/actions/setup-app-deps
      with:
        app: deploy-web
    # The runner's local Azure package mirror drops out periodically. apt sets no network timeout of its own,
    # so it exhausts its retries there, fails over to archive.ubuntu.com and then blocks forever on a dead
    # connection: on 2026-08-19 this step ran 82 minutes before being killed by hand, against a healthy 12s.
    # `timeout` has to do the bounding because composite action steps don't accept `timeout-minutes`.
    - name: Install Playwright Dependencies
      shell: bash
      working-directory: apps/deploy-web
      run: |
        printf 'Acquire::http::Timeout "30";\nAcquire::https::Timeout "30";\nAcquire::Retries "2";\n' | sudo tee /etc/apt/apt.conf.d/99-e2e-timeouts.conf > /dev/null
        timeout 5m npx playwright install-deps chromium
    - name: Install Playwright Browsers
      shell: bash
      working-directory: apps/deploy-web
      run: npx playwright install --no-shell chromium
    - name: Run e2e tests
      id: e2e-tests
      env:
        BASE_URL: ${{ inputs.url }}
        E2E_TESTING_CLIENT_TOKEN: ${{ inputs.testing-client-token }}
        AUTH0_M2M_DOMAIN: ${{ inputs.auth0-m2m-domain }}
        AUTH0_M2M_CLIENT_ID: ${{ inputs.auth0-m2m-client-id }}
        AUTH0_M2M_CLIENT_SECRET: ${{ inputs.auth0-m2m-client-secret }}
        E2E_INBOX_API_URL: ${{ inputs.e2e-inbox-api-url }}
        E2E_INBOX_API_TOKEN: ${{ inputs.e2e-inbox-api-token }}
        E2E_INBOX_EMAIL_DOMAIN: ${{ inputs.e2e-inbox-email-domain }}
        TEST_USER_EMAIL: ${{ inputs.test-user-email }}
        TEST_USER_PASSWORD: ${{ inputs.test-user-password }}
        USER_DATA_DIR: ${{ runner.temp }}/chrome-profile-${{ github.run_id }}-${{ github.run_attempt }}
        CI: "true"
      shell: bash
      run: npm run test:e2e --workspace=apps/deploy-web
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      id: playwright-report
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: apps/deploy-web/playwright-report/
        retention-days: 5

    - uses: ./.github/actions/slack-tests-failed-notification
      if: ${{ !cancelled() && steps.e2e-tests.outcome == 'failure' }}
      with:
        ref: ${{ inputs.ref }}
        url: ${{ inputs.url }}
        gh-user-to-slack-user: ${{ inputs.gh-user-to-slack-user }}
        slack-webhook-url: ${{ inputs.slack-webhook-url }}
        message-title: "Console web UI tests failed on beta"

    - name: Summarize Test Results
      if: ${{ !cancelled() }}
      shell: bash
      env:
        STEPS_E2E_TESTS_OUTCOME: ${{ steps.e2e-tests.outcome }}
        STEPS_PLAYWRIGHT_REPORT_OUTPUTS_ARTIFACT_URL: ${{ steps.playwright-report.outputs.artifact-url }}
      run: | # shell
        echo "### 📝 E2E Test Summary" >> $GITHUB_STEP_SUMMARY
        prefix=":white_check_mark: Passed"
        if [ "${STEPS_E2E_TESTS_OUTCOME}" == "failure" ]; then
          prefix=":x: Failed"
        fi
        echo "${prefix}, [download tests report](${STEPS_PLAYWRIGHT_REPORT_OUTPUTS_ARTIFACT_URL})" >> $GITHUB_STEP_SUMMARY
